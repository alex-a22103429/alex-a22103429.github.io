<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo 04 - Layout Grid</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="grid-layout">
      <header class="grid-header">
        <h1>Header (Topo)</h1>
        <a href="../index.html" class="back-link">← Voltar aos Demos</a>
      </header>

      <nav class="grid-nav">
        <h3>Navegação (Nav Esquerda)</h3>
        <ul>
          <li><a href="#">Link 1</a></li>
          <li><a href="#">Link 2</a></li>
          <li><a href="#">Link 3</a></li>
        </ul>
      </nav>

      <main class="grid-main">
        <h2>Conteúdo Principal (Main Centro)</h2>
        <p>
          Este layout utiliza CSS Grid para organizar a estrutura semântica da
          página.
        </p>
      </main>

      <aside class="grid-aside">
        <h3>Aside (Barra Lateral Direita)</h3>
        <p>Informação complementar ou widgets.</p>
      </aside>

      <footer class="grid-footer">
        <p>Footer (Rodapé em Baixo)</p>
      </footer>
    </div>
  </body>
</html>
