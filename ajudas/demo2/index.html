<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo 02 - Estilos de Lista</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="grid-layout">
      <header class="grid-header">
        <h1>Header (Topo)</h1>
        <a href="../index.html" class="back-link">← Voltar aos Demos</a>
      </header>

      <nav class="grid-nav">
        <h3>Navegação</h3>
        <ul>
          <li><a href="#">Início</a></li>
          <li><a href="#">Sobre</a></li>
          <li><a href="#">Serviços</a></li>
        </ul>
      </nav>

      <main class="grid-main">
        <div class="list-container">
          <h2 class="list-title">Título da Lista Personalizado</h2>
          <ul class="custom-list">
            <li class="linha-1">Primeira linha (Cor Verde)</li>
            <li class="linha-2">Segunda linha (Cor Azul)</li>
            <li class="linha-1">Terceira linha (Cor Verde)</li>
            <li class="linha-2">Quarta linha (Cor Azul)</li>
          </ul>
        </div>
      </main>

      <aside class="grid-aside">
        <h3>Aside</h3>
        <p>Conteúdo lateral de apoio.</p>
      </aside>

      <footer class="grid-footer">
        <p>Footer (Rodapé)</p>
      </footer>
    </div>
  </body>
</html>
